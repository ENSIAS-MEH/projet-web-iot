      <section aria-label="Sensor readings">

          <div class="loading-state" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <span>Loading sensors...</span>
          </div>
        </div>
      </section>

      <!-- Charts section — populated by dashboard.js (T008) -->
      <section aria-label="Sensor history charts" style="margin-top: 2rem;">
        <div id="charts-section">
          <!-- Charts injected by dashboard.js -->
        </div>
      </section>

    </div>
