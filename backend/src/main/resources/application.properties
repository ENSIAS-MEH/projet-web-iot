# ============================================================
# Cold Room Monitoring System - Application Configuration
# ============================================================

# Server
server.port=8080

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/cold_room_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson - serialize dates as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.com.coldroom=DEBUG
logging.level.org.hibernate.SQL=DEBUG